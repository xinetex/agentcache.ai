<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentCache Advanced Services</title>
    <meta name="description" content="Package AgentCache memory, reliability, and governed execution services">
    <link rel="stylesheet" href="/src/index.css">
</head>

<body>
    <div id="file-fallback" style="display:none;min-height:100vh;background:#030508;color:#e0f7fa;font-family:Inter,system-ui,sans-serif;padding:48px;">
        <main style="max-width:760px;margin:0 auto;border:1px solid rgba(34,211,238,.28);border-radius:8px;background:rgba(6,11,20,.86);padding:32px;">
            <p style="margin:0 0 10px;color:rgba(224,247,250,.62);font-size:12px;letter-spacing:.18em;text-transform:uppercase;">AgentCache Advanced Services</p>
            <h1 style="margin:0 0 16px;font-size:36px;line-height:1.1;color:white;">Advanced Services needs an app server</h1>
            <p style="margin:0 0 18px;color:rgba(224,247,250,.72);line-height:1.6;">
                This page is a Vite React entry point. Open it from a Vercel preview or the Vite dev server so the JavaScript bundle, CSS, and API routes resolve correctly.
            </p>
            <code style="display:block;padding:14px 16px;border-radius:8px;background:rgba(255,255,255,.06);color:#67e8f9;">npm run dev</code>
        </main>
    </div>
    <div id="root"></div>
    <script>
        if (window.location.protocol === 'file:') {
            document.getElementById('file-fallback').style.display = 'block';
            document.getElementById('root').style.display = 'none';
        }
    </script>
    <script type="module" src="/src/console/main.jsx"></script>
</body>

</html>
